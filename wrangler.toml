name = "driver-telegram-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# በdashboard ላይ የተቀመጡ ተለዋዋጮች (ለምሳሌ ADMIN_CHAT_ID) በdeploy ጊዜ እንዳይሰረዙ
keep_vars = true

# HTML ፋይሉን እንደ ጽሑፍ ማስገባት
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# D1 ዳታቤዝ — ID ሳይኖር ሲቀር Cloudflare በመጀመሪያው deploy በራሱ ይፈጥረዋል
[[d1_databases]]
binding = "DB"
database_name = "driver-telegram-bot-db"

[observability]
enabled = true

# ሚስጥር ያልሆኑ ቅንብሮች (በdashboard ላይም መቀየር ይቻላል)
# በየቀኑ 09:00 (የአዲስ አበባ ሰዓት = 06:00 UTC) — ማስታወሻዎች እና የአስተዳዳሪ ማጠቃለያ
[triggers]
crons = ["0 6 * * *"]

[vars]
BRAND_NAME = "Cabby"
SUPPORT_CONTACT = "@Cabby_Et"        # ለምሳሌ "0911000000 ወይም @cabby_support"
# ሲጸድቁ ለአሽከርካሪው የሚላኩ የመተግበሪያ ሊንኮች (እንደ መረጠው አገልግሎት እና ስልክ)
SHARE_ANDROID_URL = "https://play.google.com/store/apps/details?id=com.car.poolsharedriver&pcampaignid=web_share"      # Cabby Share — Google Play
SHARE_IOS_URL = "https://cabbyet.com/"          # Cabby Share — App Store
RESERVE_ANDROID_URL = "https://play.google.com/store/apps/details?id=com.car.gocabbydriver&pcampaignid=web_share"    # Cabby Reserve — Google Play
RESERVE_IOS_URL = "https://cabbyet.com/"        # Cabby Reserve — App Store
DRIVER_GROUP_LINK = "https://t.me/cabbyshareET"      # የአሽከርካሪዎች ግሩፕ ሊንክ
REFERRAL_REWARD = "50 ብር"        # ለምሳሌ "300 ብር" — ባዶ ከሆነ መጠኑ አይጠቀስም

# ሚስጥሮች (በ `npx wrangler secret put` ወይም በdashboard → Settings → Variables and Secrets)፦
#   BOT_TOKEN       — ከ @BotFather
#   WEBHOOK_SECRET  — ማንኛውም ረጅም የዘፈቀደ ጽሑፍ (A-Z a-z 0-9 _ -)
#   ADMIN_CHAT_ID   — ማመልከቻዎች የሚላኩበት ቻት/ግሩፕ ID
#   ADMIN_IDS       — (አማራጭ) ማጽደቅ የሚችሉ አስተዳዳሪዎች Telegram ID፣ በኮማ ተለያይተው
