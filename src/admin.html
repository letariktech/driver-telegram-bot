<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__BRAND__ · Driver Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: light;
  --ink: #172033; --ink-2: #4a5468; --muted: #7a8396;
  --surface: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fb; --line: #dde2ea;
  --blue: #1f5fbf; --blue-ink: #ffffff; --blue-soft: #e6eefb;
  --signal: #f2b705; --signal-soft: #fff5d1; --signal-ink: #6b4f00;
  --green: #148a52; --green-soft: #e3f4ea; --red: #c93c3c; --red-soft: #fbe9e9;
  --s1: #2a78d6; --s2: #eb6834;
  --display: "Barlow Semi Condensed", "Noto Sans Ethiopic", system-ui, sans-serif;
  --body: "Noto Sans Ethiopic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 14px; --r-md: 10px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --ink: #e8ecf3; --ink-2: #b4bccb; --muted: #8890a0;
    --surface: #0e1420; --panel: #161e2d; --panel-2: #1c2536; --line: #2a3448;
    --blue: #4a8ae8; --blue-ink: #0b1220; --blue-soft: #1a2b48;
    --signal: #f5c431; --signal-soft: #3a3010; --signal-ink: #f5d679;
    --green: #39b97a; --green-soft: #13301f; --red: #e66767; --red-soft: #3a1a1c;
    --s1: #3987e5; --s2: #d95926;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface); color: var(--ink); font: 14.5px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; position: relative; overflow: hidden; }
.logo-mark::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 10px); opacity: .9; }
.logo b { font-family: var(--display); font-size: 21px; letter-spacing: .2px; display: block; line-height: 1; }
.logo small { color: var(--muted); font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-md); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--panel-2); }
.nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 700; }
.nav a .ico { width: 20px; text-align: center; }
.nav a .badge { margin-left: auto; background: var(--signal); color: #3b2c00; font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; font-family: var(--display); }
.rail-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.rail-foot a { color: var(--muted); }
main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(8px);
  display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
.topbar h1 { font-family: var(--display); font-size: 26px; margin: 0; font-weight: 700; letter-spacing: .2px; }
.search { margin-left: auto; position: relative; width: min(360px, 40vw); }
.search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); }
.search::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 17px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 8px 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.view { padding: 22px 28px 60px; }
.empty { color: var(--muted); padding: 28px; text-align: center; }

/* ---------- route line (pipeline) ---------- */
.route { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 26px 18px; margin-bottom: 22px; }
.route-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.route-head h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.route-head .meta { color: var(--muted); font-size: 13.5px; }
.route-head .meta b { color: var(--ink); font-family: var(--display); font-size: 16px; }
.line { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; }
.line::before { content: ""; position: absolute; left: 8%; right: 8%; top: 17px; height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--blue) 0 83%, var(--green) 83%); }
.stop { position: relative; text-align: center; background: none; border: 0; padding: 0 4px; }
.stop .dot { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; background: var(--panel); border: 5px solid var(--blue);
  font-family: var(--display); font-weight: 700; font-size: 15px; position: relative; z-index: 1; transition: transform .15s; }
.stop:hover .dot { transform: scale(1.08); }
.stop.alert .dot { border-color: var(--signal); background: var(--signal-soft); color: var(--signal-ink); }
.stop.end .dot { border-color: var(--green); background: var(--green); color: #fff; }
.stop .lbl { font-weight: 600; font-size: 13.5px; display: block; }
.stop .sub { color: var(--muted); font-size: 12px; }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.col { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; max-height: calc(100vh - 330px); min-height: 160px; }
.col.alert { border-top: 4px solid var(--signal); }
.col-head { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
.col-head b { font-weight: 700; }
.col-head .n { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink-2); }
.col-body { overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.dcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; text-align: left; width: 100%; display: block; }
.dcard:hover { border-color: var(--blue); }
.dcard .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.dcard .nm .green { color: var(--green); }
.dcard .ln { color: var(--muted); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.y { background: var(--signal-soft); color: var(--signal-ink); border-color: transparent; }
.tag.g { background: var(--green-soft); color: var(--green); border-color: transparent; }
.tag.r { background: var(--red-soft); color: var(--red); border-color: transparent; }
.tag.b { background: var(--blue-soft); color: var(--blue); border-color: transparent; }

/* ---------- side panels on board ---------- */
.split { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-top: 22px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
.panel-head h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.panel-head a { margin-left: auto; color: var(--blue); font-size: 13px; text-decoration: none; font-weight: 600; }
.rows { padding: 0 8px 10px; }
.rowi { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: var(--r-md); }
.rowi:hover { background: var(--panel-2); }
.rowi .when { font-family: var(--display); font-weight: 600; min-width: 92px; color: var(--ink-2); font-size: 14px; }
.rowi .who { flex: 1; min-width: 0; }
.rowi .who b { font-weight: 600; }
.rowi .who div { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clickable { cursor: pointer; }

/* ---------- table ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters select, .filters input { padding: 8px 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); }
.filters .count { margin-left: auto; color: var(--muted); }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--panel-2); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.st-awaiting_docs { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.st-pending { background: var(--signal-soft); color: var(--signal-ink); }
.st-test, .st-inspection, .st-orientation { background: var(--blue-soft); color: var(--blue); }
.st-active { background: var(--green-soft); color: var(--green); }
.st-rejected, .st-suspended { background: var(--red-soft); color: var(--red); }
.pager { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 28, .38); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100vw); background: var(--panel); z-index: 21; transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0,0,0,.12); }
.drawer.on { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
.dr-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.dr-top { display: flex; align-items: flex-start; gap: 10px; }
.dr-head h2 { margin: 0; font-family: var(--display); font-size: 25px; line-height: 1.15; }
.dr-head .sub { color: var(--muted); margin-top: 3px; }
.x { margin-left: auto; border: 0; background: var(--panel-2); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; flex: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.actform { margin-top: 12px; background: var(--panel-2); border-radius: var(--r-md); padding: 12px; display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
.actform.on { display: flex; }
.actform input, .actform select, .actform textarea { padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--panel); flex: 1; min-width: 160px; }
.actform textarea { min-height: 64px; width: 100%; flex-basis: 100%; }
.tabs { display: flex; gap: 2px; padding: 0 22px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 11px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--blue); border-color: var(--blue); }
.dr-body { overflow-y: auto; padding: 18px 22px 40px; flex: 1; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 0; }
.kv dt { color: var(--muted); padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kv dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
.kv-group { font-family: var(--display); font-size: 16px; font-weight: 700; margin: 18px 0 6px; color: var(--ink-2); }
.kv-group:first-child { margin-top: 0; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.doc { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--panel-2); text-align: left; padding: 0; }
.doc .img { aspect-ratio: 4/3; background: var(--line) center/cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.doc .cap { padding: 7px 9px; font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.doc.missing { border-style: dashed; } .doc.missing .img { background: none; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .pt { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--blue); background: var(--panel); margin-top: 3px; }
.timeline .pt.g { border-color: var(--green); } .timeline .pt.r { border-color: var(--red); } .timeline .pt.y { border-color: var(--signal); }
.timeline .t { font-weight: 600; } .timeline .m { color: var(--muted); font-size: 12.5px; }
.timeline .d { background: var(--panel-2); border-radius: var(--r-sm); padding: 6px 9px; margin-top: 4px; font-size: 13.5px; white-space: pre-wrap; }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(5,8,14,.86); display: none; place-items: center; padding: 30px; }
.lightbox.on { display: grid; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 8px; }
.lightbox .cap { color: #fff; text-align: center; margin-top: 10px; }

/* ---------- analytics ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chart { padding: 6px 18px 18px; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--display); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 16px; padding: 0 18px; color: var(--ink-2); font-size: 13px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 3; }
.hbar { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; padding: 5px 18px; font-size: 13.5px; }
.hbar .track { height: 12px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hbar .v { text-align: right; font-family: var(--display); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 18px; }
.kpi .v { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.1; }
.kpi .k { color: var(--muted); font-size: 13px; }

/* ---------- settings ---------- */
.set { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.set .panel { padding-bottom: 16px; }
.set .wide { grid-column: 1 / -1; }
.set .body { padding: 0 18px; }
.set .hint { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.nums label { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.nums input { width: 100%; margin-top: 4px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); font-family: var(--display); font-size: 17px; font-weight: 600; }
.nums small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggles button { border: 1.5px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 13px; font-weight: 500; }
.toggles button.on { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.toggles button[disabled] { opacity: .7; cursor: default; }
.switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.switch input { width: 18px; height: 18px; }
.links { display: grid; grid-template-columns: 180px 1fr; gap: 8px 12px; align-items: center; }
.links input { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); width: 100%; }
.links span { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.ag-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.ag-tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-sm); padding: 4px 10px; }
.ag-tabs button.on { border-color: var(--blue); color: var(--blue); font-weight: 700; }
.ag-text { width: 100%; min-height: 360px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); font: 14px/1.65 var(--body); resize: vertical; }
.savebar { position: sticky; bottom: 0; margin-top: 16px; padding: 12px 0; background: linear-gradient(transparent, var(--surface) 30%); display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
.savebar .msg { color: var(--muted); margin-right: auto; }
.fixbox { margin-top: 10px; background: var(--signal-soft); color: var(--ink); border-radius: var(--r-md); padding: 10px 12px; font-size: 13.5px; }
.fixbox b { color: var(--signal-ink); }
.chk { display: flex; flex-wrap: wrap; gap: 6px 12px; flex-basis: 100%; font-size: 13px; }
.chk label { display: flex; align-items: center; gap: 5px; }
@media (max-width: 1100px) { .set { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .nums, .links { grid-template-columns: 1fr; } }

/* ---------- login / toast ---------- */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.gate-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 34px 32px; max-width: 420px; text-align: center; }
.gate-card h1 { font-family: var(--display); font-size: 30px; margin: 14px 0 8px; }
.gate-card p { color: var(--ink-2); margin: 0 0 6px; }
.gate-card code { background: var(--panel-2); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; z-index: 50; font-weight: 500; display: none; max-width: 90vw; }
.toast.err { background: var(--red); color: #fff; }

/* ---------- responsive ---------- */
@media (max-width: 1320px) { .board { grid-template-columns: repeat(5, 250px); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; } .col { scroll-snap-align: start; } }
@media (max-width: 1100px) { .split, .grid2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px; z-index: 10; border-right: 0; border-top: 1px solid var(--line); }
  .logo, .rail-foot { display: none; }
  .nav { display: flex; width: 100%; justify-content: space-around; }
  .nav a { flex-direction: column; gap: 0; font-size: 11px; padding: 6px 4px; }
  .nav a .badge { position: absolute; margin: -4px 0 0 18px; }
  .nav a { position: relative; }
  .topbar { padding: 12px 16px; flex-wrap: wrap; } .topbar h1 { font-size: 22px; } .search { width: 100%; order: 3; }
  .view { padding: 16px 14px 90px; }
  .line { grid-template-columns: repeat(6, 1fr); } .route { padding: 16px 10px; } .stop .sub { display: none; } .stop .lbl { font-size: 12px; } .stop .dot { width: 34px; height: 34px; border-width: 4px; } .line::before { top: 15px; }
  .col { max-height: none; }
  .kv { grid-template-columns: 120px 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="lightbox" id="lightbox"><div><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";
  var BRAND = "__BRAND__";
  var tg = window.Telegram && window.Telegram.WebApp;
  var INIT = tg && tg.initData ? tg.initData : "";
  if (INIT) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var M = null; // /me
  var root = document.getElementById("root");

  // ---------- utils ----------
  function h(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(s, el) { return (el || document).querySelector(s); }
  function api(path, opts) {
    opts = opts || {};
    var headers = { "content-type": "application/json" };
    if (INIT) headers["x-telegram-init-data"] = INIT;
    return fetch("/api/admin/" + path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: "same-origin" })
      .then(function (r) {
        if (r.status === 401) { gate(); throw new Error("unauthorized"); }
        return r.json().then(function (j) { if (!r.ok && !j.error) j.error = "ስህተት (" + r.status + ")"; return j; });
      });
  }
  var toastT;
  function toast(msg, err) { var t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(function () { t.style.display = "none"; }, 3200); }
  function S(st) { return (M.labels.status[st] || st).replace(/^\S+\s/, ""); }
  function pill(st) { return '<span class="pill st-' + h(st) + '">' + h(S(st)) + "</span>"; }
  function O(group, v) { return (M.labels.opt[group] && M.labels.opt[group][v]) || v; }
  function list(group, csv) { return csv ? String(csv).split(",").map(function (x) { return O(group, x); }).join("፣ ") : "—"; }
  function ago(iso) {
    if (!iso) return "";
    var s = (Date.now() - Date.parse(iso.replace(" ", "T") + "Z")) / 1000;
    if (s < 60) return "አሁን"; if (s < 3600) return Math.floor(s / 60) + " ደቂቃ በፊት"; if (s < 86400) return Math.floor(s / 3600) + " ሰዓት በፊት";
    return Math.floor(s / 86400) + " ቀን በፊት";
  }
  function local(iso) { if (!iso) return ""; var d = new Date(iso.replace(" ", "T") + "Z"); d = new Date(d.getTime() + 3 * 3600e3); return d.toISOString().slice(0, 16).replace("T", " "); }
  var STAGE = { test: "የቃል እና የተግባር ፈተና", inspection: "የመኪና ፍተሻ", orientation: "ስልጠና" };
  var EV = {
    registered: ["ተመዘገበ", "b"], form_updated: ["ቅጹን አስተካከለ", ""], submitted: ["ሰነዶቹን አቀረበ", "y"], docs_approved: ["ሰነዶቹ ጸደቁ", "g"],
    doc_requested: ["ሰነድ እንደገና ተጠየቀ", "y"], rejected: ["ውድቅ ተደረገ", "r"], scheduled: ["ቀጠሮ ተያዘ", "b"], appt_confirmed: ["ቀጠሮውን አረጋገጠ", "g"],
    appt_reschedule: ["ሌላ ቀን ጠየቀ", "y"], passed: ["አለፈ", "g"], activated: ["ገቢር ሆነ", "g"], suspended: ["ታገደ", "r"], unsuspended: ["እገዳ ተነሳ", "g"],
    note: ["ማስታወሻ", ""], fix_submitted: ["እገዳ ለማንሳት ማስተካከያ አቀረበ", "y"], fix_rejected: ["ማስተካከያው በቂ አልሆነም", "r"], settings_changed: ["ቅንብሮችን ቀየረ", "b"], message: ["መልዕክት ተላከ", "b"], referral_reward: ["የጥቆማ ሽልማት ማሳወቂያ", "g"], referral_paid: ["የጥቆማ ሽልማት ተከፈለ", "g"], admin_login: ["ወደ ዳሽቦርድ ገባ", ""],
  };
  function evDetail(e) {
    if (!e.detail) return "";
    if (e.type === "docs_approved") return "→ " + (STAGE[e.detail] || e.detail);
    if (e.type === "passed") return STAGE[e.detail] || e.detail;
    if (e.type === "scheduled") return e.detail.replace(/^(test|inspection|orientation): /, function (_, k) { return STAGE[k] + " · "; });
    if (e.type === "rejected" || e.type === "suspended") return M.labels.reasons[e.detail] || e.detail;
    if (e.type === "doc_requested") return M.labels.docs[e.detail] || e.detail;
    return e.detail;
  }
  function actorLabel(a) { return a === "driver" ? "አሽከርካሪው" : a === "system" ? "ሲስተም" : a; }

  // ---------- gate ----------
  function gate() {
    root.innerHTML = '<div class="gate"><div class="gate-card"><div class="logo-mark" style="margin:0 auto;width:52px;height:52px;border-radius:14px"></div>' +
      "<h1>" + h(BRAND) + " Driver Ops</h1><p>ለመግባት በTelegram ቦቱ ውስጥ <code>/dashboard</code> ብለው የሚመጣውን ሊንክ ይክፈቱ።</p>" +
      '<p style="color:var(--muted);font-size:13px;margin-top:14px">ሊንኩ ለ15 ደቂቃ ይሰራል። ከገቡ በኋላ ለ7 ቀን አይጠይቅዎትም።</p></div></div>';
  }

  // ---------- shell ----------
  var VIEWS = [
    ["board", "🛣", "ቦርድ"], ["drivers", "👥", "አሽከርካሪዎች"], ["appointments", "📅", "ቀጠሮዎች"],
    ["referrals", "🤝", "ጥቆማዎች"], ["activity", "🕘", "እንቅስቃሴ"], ["reports", "📈", "ሪፖርት"], ["settings", "⚙️", "ቅንብሮች"],
  ];
  function shell() {
    root.innerHTML = '<div class="app"><nav class="rail"><div class="logo"><div class="logo-mark"></div><div><b>' + h(BRAND) + '</b><small>Driver Ops</small></div></div><div class="nav">' +
      VIEWS.map(function (v) { return '<a href="#' + v[0] + '" data-v="' + v[0] + '"><span class="ico">' + v[1] + "</span>" + v[2] + (v[0] === "board" ? '<span class="badge" id="nav-badge" hidden></span>' : "") + "</a>"; }).join("") +
      '</div><div class="rail-foot">' + h(M.admin.name) + ' · <a href="/admin/logout">ውጣ</a></div></nav>' +
      '<main><div class="topbar"><h1 id="vtitle"></h1><label class="search"><input id="q" placeholder="ስም፣ ስልክ፣ CB ኮድ ወይም ሰሌዳ ፈልግ" aria-label="ፈልግ"></label>' +
      '<a class="btn hide-sm" href="/api/admin/export.csv">⬇ Excel</a></div><div class="view" id="view"></div></main></div>';
    $("#q").addEventListener("keydown", function (e) { if (e.key === "Enter") { location.hash = "drivers"; DS.q = this.value.trim(); DS.offset = 0; route(true); } });
  }

  var refreshT;
  function route(force) {
    var v = (location.hash || "#board").slice(1).split("/")[0];
    if (!VIEWS.some(function (x) { return x[0] === v; })) v = "board";
    [].forEach.call(document.querySelectorAll(".nav a"), function (a) { a.classList.toggle("on", a.dataset.v === v); });
    $("#vtitle").textContent = VIEWS.find(function (x) { return x[0] === v; })[2];
    clearInterval(refreshT);
    ({ board: board, drivers: drivers, appointments: appointments, referrals: referrals, activity: activity, reports: reports, settings: settings })[v]();
    if (v === "board") refreshT = setInterval(function () { if (!document.hidden && !$("#drawer").classList.contains("on")) board(true); }, 60000);
    var id = (location.hash.split("/")[1] || "");
    if (/^\d+$/.test(id)) openDriver(Number(id));
  }

  function dcard(c) {
    var tags = [];
    if (c.green) tags.push('<span class="tag g">⚡ ቅድሚያ</span>');
    if (c.status === "pending" && c.next_stage) tags.push('<span class="tag">→ ' + h(STAGE[c.next_stage]) + "</span>");
    if (["test", "inspection", "orientation"].indexOf(c.status) >= 0) {
      tags.push(c.appt_label ? '<span class="tag b">📅 ' + h(c.appt_label.split(" — ")[0]) + "</span>" + (c.appt_confirmed ? '<span class="tag g">✓ አረጋግጧል</span>' : "") : '<span class="tag y">ቀጠሮ ያስፈልጋል</span>');
    }
    if (c.waiting_days >= 2 && c.status !== "active") tags.push('<span class="tag ' + (c.waiting_days >= 4 ? "r" : "y") + '">' + c.waiting_days + " ቀን</span>");
    return '<button class="dcard" data-id="' + c.tg_id + '"><div class="nm">' + h(c.full_name) + "</div>" +
      '<div class="ln">' + h(c.code ? c.code + " · " : "") + h(c.phone) + "</div>" +
      '<div class="ln">' + (c.vehicle ? "🚗 " + h(c.vehicle) : "🚶 መኪና የለውም") + " · " + h(list("services", c.services)) + "</div>" +
      (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") + "</button>";
  }
  function bindCards(el) { [].forEach.call(el.querySelectorAll("[data-id]"), function (b) { b.addEventListener("click", function () { openDriver(Number(b.dataset.id)); }); }); }

  // ---------- board ----------
  function board(silent) {
    var view = $("#view");
    if (!silent) view.innerHTML = '<div class="empty">በመጫን ላይ…</div>';
    api("overview").then(function (o) {
      var s = o.stats, n = function (k) { return s.byStatus[k] || 0; };
      var total = Object.keys(s.byStatus).reduce(function (a, k) { return a + s.byStatus[k]; }, 0);
      var needs = n("pending") + o.appointments.filter(function (a) { return !a.appt_label; }).length + o.fixes.length;
      var badge = $("#nav-badge"); badge.hidden = !needs; badge.textContent = needs;
      var stops = [
        ["awaiting_docs", "ሰነድ በመጠበቅ", "ቅጽ ሞልተዋል"], ["pending", "ግምገማ", "ውሳኔ ይጠብቃሉ", 1], ["test", "ፈተና", "መኪና የሌላቸው"],
        ["inspection", "ፍተሻ", "ከ" + M.rules.inspection_after + " ዓመት በላይ"], ["orientation", "ስልጠና", "የመጨረሻ ደረጃ"], ["active", "ገቢር", "+" + s.activatedWeek + " በሳምንቱ", 0, 1],
      ];
      var cols = [["awaiting_docs", "📎 ሰነድ በመጠበቅ"], ["pending", "⏳ ሰነድ ግምገማ", 1], ["test", "📝 ፈተና"], ["inspection", "🔧 የመኪና ፍተሻ"], ["orientation", "🎓 ስልጠና"]];
      var today = new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
      var upcoming = o.appointments.filter(function (a) { return a.appt_at ? a.appt_at.slice(0, 10) >= today : !!a.appt_label; }).slice(0, 8);
      view.innerHTML =
        '<section class="route"><div class="route-head"><h2>የምዝገባ መስመር</h2>' +
        '<span class="meta">ጠቅላላ <b>' + total + '</b></span><span class="meta">ዛሬ የጀመሩ <b>' + s.today + '</b></span><span class="meta">⚡ ኤሌክትሪክ/ሃይብሪድ <b>' + s.green + '</b></span>' +
        '<span class="meta">ውድቅ <b>' + n("rejected") + '</b> · ታግደዋል <b>' + n("suspended") + "</b></span></div>" +
        '<div class="line">' + stops.map(function (st) {
          return '<button class="stop' + (st[3] && n(st[0]) ? " alert" : "") + (st[4] ? " end" : "") + '" data-col="' + st[0] + '"><span class="dot num">' + n(st[0]) + '</span><span class="lbl">' + st[1] + '</span><span class="sub">' + h(st[2]) + "</span></button>";
        }).join("") + "</div></section>" +
        (o.fixes.length ? '<section class="panel" style="margin-bottom:14px;border-top:4px solid var(--signal)"><div class="panel-head"><h3>♻️ እገዳ ለማንሳት ማስተካከያ ያቀረቡ</h3><span style="margin-left:auto;color:var(--muted)">' + o.fixes.length + '</span></div><div class="rows">' +
          o.fixes.map(function (f) { return '<div class="rowi clickable" data-id="' + f.tg_id + '"><div class="who"><b>' + h(f.full_name) + "</b> " + h(f.code || "") + "<div>" + h(M.labels.reasons[f.reject_reason] || f.reject_reason || "") + " · " + h(ago(f.fix_submitted_at)) + '</div></div><span class="tag y">ይገምግሙ</span></div>'; }).join("") + "</div></section>" : "") +
        '<div class="board">' + cols.map(function (c) {
          var items = o.pipeline[c[0]];
          return '<div class="col' + (c[2] && items.length ? " alert" : "") + '" id="col-' + c[0] + '"><div class="col-head"><b>' + c[1] + '</b><span class="n">' + n(c[0]) + '</span></div><div class="col-body">' +
            (items.length ? items.map(dcard).join("") : '<div class="empty" style="padding:16px">ባዶ</div>') + "</div></div>";
        }).join("") + "</div>" +
        '<div class="split"><section class="panel"><div class="panel-head"><h3>የሚቀጥሉ ቀጠሮዎች</h3><a href="#appointments">ሁሉንም ይዩ</a></div><div class="rows">' +
        (upcoming.length ? upcoming.map(function (a) {
          return '<div class="rowi clickable" data-id="' + a.tg_id + '"><span class="when">' + (a.appt_at ? h(local2(a.appt_at)) : '<span class="tag">ጽሑፍ</span>') + '</span><div class="who"><b>' + h(a.full_name) + "</b><div>" + h(STAGE[a.status]) + (a.appt_at ? (a.appt_label.indexOf(" — ") > 0 ? " · " + h(a.appt_label.split(" — ").slice(1).join(" — ")) : "") : " · " + h(a.appt_label)) + "</div></div>" + (a.appt_confirmed ? '<span class="tag g">✓</span>' : '<span class="tag">ያልተረጋገጠ</span>') + "</div>";
        }).join("") : '<div class="empty">የተያዘ ቀጠሮ የለም።</div>') + "</div></section>" +
        '<section class="panel"><div class="panel-head"><h3>የቅርብ እንቅስቃሴ</h3><a href="#activity">ሁሉንም ይዩ</a></div><div class="rows">' +
        o.events.slice(0, 8).map(evRow).join("") + "</div></section></div>";
      bindCards(view);
      [].forEach.call(view.querySelectorAll(".stop"), function (b) {
        b.addEventListener("click", function () {
          var col = $("#col-" + b.dataset.col);
          if (col) col.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
          else { DS.status = b.dataset.col; location.hash = "drivers"; }
        });
      });
    }).catch(function (e) { if (e.message !== "unauthorized") view.innerHTML = '<div class="empty">መጫን አልተቻለም፦ ' + h(e.message) + "</div>"; });
  }
  function local2(at) { if (!at) return "—"; var p = at.split("T"); var d = p[0].split("-"); return d[2] + "/" + d[1] + " " + p[1].slice(0, 5); }
  function evRow(e) {
    var ev = EV[e.type] || [e.type, ""];
    return '<div class="rowi' + (e.tg_id ? " clickable" : "") + '" title="' + h(local(e.created_at)) + '"' + (e.tg_id ? ' data-id="' + e.tg_id + '"' : "") + '><div class="who"><b>' + h(e.full_name || actorLabel(e.actor)) + "</b> · " + h(ev[0]) +
      "<div>" + h(evDetail(e)) + (evDetail(e) ? " · " : "") + h(actorLabel(e.actor)) + " · " + h(ago(e.created_at)) + "</div></div></div>";
  }

  // ---------- drivers ----------
  var DS = { q: "", status: "", service: "", mode: "", fuel: "", sort: "recent", offset: 0 };
  function drivers() {
    var view = $("#view");
    var sel = function (id, opts) { return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + h(o[0]) + '"' + (DS[id.slice(2)] === o[0] ? " selected" : "") + ">" + h(o[1]) + "</option>"; }).join("") + "</select>"; };
    view.innerHTML = '<div class="filters">' +
      '<input id="f-q" placeholder="ፈልግ…" value="' + h(DS.q) + '">' +
      sel("f-status", [["", "ሁሉም ሁኔታዎች"]].concat(M.statuses.map(function (s) { return [s, S(s)]; }))) +
      sel("f-service", [["", "ሁሉም አገልግሎቶች"], ["share", "Cabby Share"], ["reserve", "Cabby Reserve"]]) +
      sel("f-mode", [["", "መኪና፦ ሁሉም"], ["own", "የራሱ መኪና"], ["other", "የሌላ ሰው መኪና"], ["none", "መኪና የለውም"]]) +
      sel("f-fuel", [["", "ነዳጅ፦ ሁሉም"], ["green", "⚡ ኤሌክትሪክ + ሃይብሪድ"], ["electric", "ኤሌክትሪክ"], ["hybrid", "ሃይብሪድ"], ["petrol", "ቤንዚን"], ["diesel", "ናፍጣ"]]) +
      sel("f-sort", [["recent", "በቅርብ የተቀየሩ"], ["oldest", "ረጅም የጠበቁ"], ["name", "በስም"], ["code", "በCB ኮድ"]]) +
      '<span class="count" id="f-count"></span></div><div id="tbl"><div class="empty">በመጫን ላይ…</div></div>';
    ["status", "service", "mode", "fuel", "sort"].forEach(function (k) { $("#f-" + k).addEventListener("change", function () { DS[k] = this.value; DS.offset = 0; load(); }); });
    var qt; $("#f-q").addEventListener("input", function () { var v = this.value; clearTimeout(qt); qt = setTimeout(function () { DS.q = v.trim(); DS.offset = 0; load(); }, 300); });
    function load() {
      var qs = Object.keys(DS).filter(function (k) { return DS[k] !== "" && DS[k] != null; }).map(function (k) { return k + "=" + encodeURIComponent(DS[k]); }).join("&");
      api("drivers?limit=50&" + qs).then(function (r) {
        $("#f-count").textContent = r.total + " አሽከርካሪዎች";
        if (!r.rows.length) { $("#tbl").innerHTML = '<div class="empty">ምንም አልተገኘም። ማጣሪያዎቹን ይቀይሩ።</div>'; return; }
        $("#tbl").innerHTML = "<table><thead><tr><th>ስም</th><th>ስልክ</th><th class=\"hide-sm\">መኪና</th><th class=\"hide-sm\">አገልግሎት</th><th>ሁኔታ</th><th class=\"hide-sm\">የተቀየረ</th></tr></thead><tbody>" +
          r.rows.map(function (c) {
            return '<tr data-id="' + c.tg_id + '"><td><b>' + h(c.full_name) + "</b>" + (c.green ? ' <span class="tag g">⚡</span>' : "") + (c.code ? '<div style="color:var(--muted);font-size:12.5px">' + h(c.code) + "</div>" : "") + "</td><td>" + h(c.phone) +
              '</td><td class="hide-sm">' + h(c.vehicle || "—") + '</td><td class="hide-sm">' + h(list("services", c.services)) + "</td><td>" + pill(c.status) + '</td><td class="hide-sm" style="color:var(--muted)">' + h(ago(c.updated_at)) + "</td></tr>";
          }).join("") + "</tbody></table>" +

      row("የጠቆመው", r.referrer ? '<a href="#" data-id="' + r.referrer.tg_id + '">' + t(r.referrer.full_name + " " + (r.referrer.code || "")) + "</a>" : d.referral ? t(d.referral + " (አልተገኘም)") : ""),
    ]) + g("መዝገብ", [
      row("ስምምነት", d.agreement_version ? t("v" + d.agreement_version + " · " + local(d.agreement_accepted_at)) : t("አልተቀበለም (የቀድሞ ምዝገባ)")),
      row("የተመዘገበው", t(local(d.created_at))), row("ሰነድ ያቀረበው", t(local(d.submitted_at))), row("ገቢር የሆነው", t(local(d.activated_at))), row("የመጨረሻ ውሳኔ", t(d.reviewed_by)), row("Telegram ID", t(d.tg_id)),
    ]);
  }

  function docsTab(body, d, docs) {
    var have = {}; docs.forEach(function (x) { have[x.kind] = x; });
    body.innerHTML = '<div class="docs">' + d.required_docs.map(function (k) {
      var x = have[k];
      if (!x) return '<div class="doc missing"><div class="img">አልተላከም</div><div class="cap">' + h(M.labels.docs[k]) + "</div></div>";
      var src = "/api/admin/file/" + encodeURIComponent(x.file_id);
      return '<button class="doc" data-src="' + h(src) + '" data-type="' + x.file_type + '" data-cap="' + h(M.labels.docs[k]) + '"><div class="img" data-bg="' + h(src) + '">' + (x.file_type === "photo" ? "" : "📄 PDF") + '</div><div class="cap"><span>' + h(M.labels.docs[k]) + '</span><span style="color:var(--muted);font-weight:400">' + h(ago(x.created_at)) + "</span></div></button>";
    }).join("") + "</div>" + (INIT ? "" : '<p style="color:var(--muted);font-size:12.5px;margin-top:14px">ሰነዶቹ በቀጥታ ከTelegram ይጫናሉ።</p>');
    [].forEach.call(body.querySelectorAll(".doc[data-src]"), function (b) {
      var im = b.querySelector(".img");
      if (b.dataset.type === "photo") loadImg(b.dataset.src).then(function (u) { im.style.backgroundImage = "url(" + u + ")"; }).catch(function () { im.textContent = "መጫን አልተቻለም"; });
      b.onclick = function () {
        if (b.dataset.type !== "photo") return loadImg(b.dataset.src).then(function (u) { window.open(u, "_blank"); });
        loadImg(b.dataset.src).then(function (u) { $("#lb-img").src = u; $("#lb-cap").textContent = b.dataset.cap + " — " + d.full_name; $("#lightbox").classList.add("on"); });
      };
    });
  }
  var imgCache = {};
  function loadImg(src) {
    if (imgCache[src]) return imgCache[src];
    var headers = {}; if (INIT) headers["x-telegram-init-data"] = INIT;
    return (imgCache[src] = fetch(src, { headers: headers, credentials: "same-origin" }).then(function (r) { if (!r.ok) throw new Error(); return r.blob(); }).then(function (b) { return URL.createObjectURL(b); }));
  }

  function act(a, body, btn) {
    if (btn) btn.disabled = true;
    api("driver/" + current.driver.tg_id + "/" + a, { method: "POST", body: body }).then(function (res) {
      if (btn) btn.disabled = false;
      if (!res.ok) return toast(res.error || "አልተሳካም", 1);
      toast(res.warning ? "⚠️ " + res.warning : "✓ ተከናውኗል", !!res.warning);
      var id = current.driver.tg_id;
      api("driver/" + id).then(function (r) { current = r; renderDriver(a === "note" || a === "message" ? "timeline" : "info"); });
      var v = (location.hash || "#board").slice(1).split("/")[0];
      if (v === "board") board(true); else if (v === "appointments") appointments();
    }).catch(function () { if (btn) btn.disabled = false; });
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[data-id]');
    if (a) { e.preventDefault(); openDriver(Number(a.dataset.id)); }
  });

  // ---------- start ----------
  api("me").then(function (me) {
    M = me; BRAND = me.brand || BRAND;
    M.labels.opt.mode = { own: "የራሱ መኪና", other: "የሌላ ሰው መኪና", none: "መኪና የለውም" };
    shell(); route();
    window.addEventListener("hashchange", function () { if (!/\/\d+$/.test(location.hash)) { closeDriver(); route(); } });
  }).catch(function () {});
})();
</script>
</body>
</html>
