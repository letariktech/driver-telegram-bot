<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>__BRAND__ Driver</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f4f7);
    --text: var(--tg-theme-text-color, #14213d);
    --hint: var(--tg-theme-hint-color, #7b8494);
    --accent: var(--tg-theme-button-color, #1f5fbf);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #d64545);
    --green: #148a52;
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Ethiopic", sans-serif; }
  .wrap { padding: 14px 16px 100px; max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-weight: 800; font-size: 15px; color: var(--accent); }
  .langs { display: flex; gap: 4px; }
  .langs button { border: 1px solid var(--line); background: none; color: var(--hint); border-radius: 8px; padding: 4px 8px; font: inherit; font-size: 12.5px; }
  .langs button.sel { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .steps { display: flex; gap: 5px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--bg2); transition: background .2s; }
  .steps span.on { background: var(--accent); }
  .kicker { font-size: 13px; color: var(--hint); }
  h1 { font-size: 22px; margin: 2px 0 4px; }
  .lead { color: var(--hint); font-size: 14px; margin: 0 0 18px; }
  section { display: none; }
  section.active { display: block; animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { section.active { animation: none; } }
  .field { margin-bottom: 15px; }
  label, .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .opt { font-weight: 400; color: var(--hint); }
  .help { font-size: 12.5px; color: var(--hint); margin-top: 5px; }
  input, select { width: 100%; padding: 13px 14px; font-size: 16px; color: var(--text); background: var(--bg2); border: 1.5px solid transparent;
    border-radius: var(--radius); outline: none; appearance: none; -webkit-appearance: none; font-family: inherit; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--hint) 50%), linear-gradient(135deg, var(--hint) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  input:focus, select:focus { border-color: var(--accent); }
  .invalid { border-color: var(--danger) !important; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1.4fr .8fr 1.3fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); font-size: 14.5px; font-family: inherit; }
  .chips button.sel { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .chips.invalid button { border-color: var(--danger); }
  .cards { display: grid; gap: 10px; }
  .cards button { text-align: left; padding: 14px 16px; border-radius: var(--radius); border: 1.5px solid var(--bg2); background: var(--bg2); color: var(--text); font-size: 15.5px; font-weight: 600; font-family: inherit; }
  .cards button small { display: block; font-weight: 400; color: var(--hint); font-size: 13px; margin-top: 2px; }
  .cards button.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .cards.invalid button { border-color: var(--danger); }
  .inline { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; color: var(--hint); font-weight: 400; }
  .inline input { width: 18px; height: 18px; appearance: auto; -webkit-appearance: checkbox; margin: 0; }
  .note { background: var(--bg2); border-radius: var(--radius); padding: 11px 14px; font-size: 14px; color: var(--hint); margin-bottom: 14px; }
  .note.green { background: color-mix(in srgb, var(--green) 12%, var(--bg)); color: var(--green); font-weight: 600; }
  .sub { margin: 18px 0 10px; font-size: 14px; color: var(--hint); font-weight: 700; }
  .card { background: var(--bg2); border-radius: var(--radius); padding: 4px 14px; margin-bottom: 14px; }
  .card div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .card div:last-child { border-bottom: 0; }
  .card dt { color: var(--hint); flex: none; } .card dd { margin: 0; text-align: right; font-weight: 600; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 400; }
  .check input { width: 20px; height: 20px; flex: none; margin-top: 2px; appearance: auto; -webkit-appearance: checkbox; }
  .agreement { background: var(--bg2); border-radius: var(--radius); margin-bottom: 14px; }
  .agreement summary { padding: 12px 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .agreement summary span { font-weight: 400; color: var(--hint); font-size: 13px; }
  .agreement pre { white-space: pre-wrap; font: 13.5px/1.6 inherit; font-family: inherit; margin: 0; padding: 0 14px 14px; max-height: 46vh; overflow-y: auto; }
  .banner { background: color-mix(in srgb, var(--danger) 12%, var(--bg)); color: var(--danger); border-radius: var(--radius); padding: 11px 14px; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .center { text-align: center; padding: 48px 12px; }
  .center .icon { font-size: 56px; } .center h2 { margin: 12px 0 6px; } .center p { color: var(--hint); margin: 0; }
  .fallback { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: var(--bg); display: none; gap: 10px; border-top: 1px solid var(--line); }
  .fallback button { flex: 1; padding: 14px; border: 0; border-radius: var(--radius); font-size: 16px; font-weight: 600; background: var(--accent); color: var(--accent-text); font-family: inherit; }
  .fallback button.sec { background: var(--bg2); color: var(--text); flex: .5; }
</style>
</head>
<body>
<div class="wrap">
  <div id="screen-loading" class="center"><div class="icon">🚖</div><p>…</p></div>
  <div id="screen-message" class="center" hidden><div class="icon" id="msg-icon"></div><h2 id="msg-title"></h2><p id="msg-text"></p></div>

  <form id="form" hidden novalidate>
    <div class="top"><div class="brand">🚖 __BRAND__ Driver</div><div class="langs" id="langs"></div></div>
    <div class="banner" id="susp-banner" hidden data-t="suspended_edit"></div>
    <div class="steps"></div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>

    <section data-t="s1" data-lead="s1_lead">
      <div class="field"><label for="full_name" data-t="full_name"></label>
        <input id="full_name" autocomplete="name" data-ph="full_name_ph"><div class="help" data-t="full_name_help"></div></div>
      <div class="field"><label for="phone" data-t="phone"></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09XXXXXXXX">
        <label class="inline"><input type="checkbox" id="telebirr_same" checked> <span data-t="telebirr_same"></span></label></div>
      <div class="field" id="telebirr_field" hidden><label for="telebirr" data-t="telebirr"></label><input id="telebirr" type="tel" inputmode="tel" placeholder="09XXXXXXXX"></div>
      <div class="row">
        <div class="field"><label for="dob" data-t="dob"></label><input id="dob" type="date"></div>
        <div class="field"><label for="sub_city" data-t="sub_city"></label><select id="sub_city" data-opts="SUB_CITIES" data-group="sub_city"></select></div>
      </div>
      <div class="field"><label for="tin_no" data-t="tin_no"></label><input id="tin_no" inputmode="numeric" maxlength="10" placeholder="0000000000"></div>
      <div class="field"><span class="label" data-t="spoken"></span><div class="chips" id="languages" data-opts="SPOKEN" data-group="spoken" data-multi></div></div>
      <div class="sub" data-t="emergency"></div>
      <div class="row">
        <div class="field"><label for="emergency_name" data-t="em_name"></label><input id="emergency_name"></div>
        <div class="field"><label for="emergency_phone" data-t="em_phone"></label><input id="emergency_phone" type="tel" inputmode="tel" placeholder="09XXXXXXXX"></div>
      </div>
    </section>

    <section data-t="s2" data-lead="s2_lead">
      <div class="field"><label for="license_no" data-t="license_no"></label><input id="license_no" autocapitalize="characters" placeholder="AA123456"></div>
      <div class="row">
        <div class="field"><label for="license_grade" data-t="grade"></label><select id="license_grade" data-opts="LICENSE_GRADES" data-group="grade"></select></div>
        <div class="field"><label for="license_expiry" data-t="expiry"></label><input id="license_expiry" type="date"></div>
      </div>
      <div class="field"><span class="label" data-t="experience"></span><div class="chips" id="experience" data-opts="EXPERIENCE" data-group="experience"></div></div>
      <div class="field"><span class="label" data-t="prev"></span><div class="chips" id="prev_platforms" data-opts="PREV_PLATFORMS" data-group="prev" data-multi data-exclusive="none"></div></div>
    </section>

    <section data-t="s3" data-lead="s3_lead">
      <div class="field"><div class="cards" id="vehicle_mode"></div></div>
      <div id="vehicle-fields" hidden>
        <div class="row">
          <div class="field"><label for="vehicle_make" data-t="make"></label><select id="vehicle_make" data-opts="VEHICLE_MAKES" data-group="make"></select></div>
          <div class="field"><label for="vehicle_model" data-t="model"></label><input id="vehicle_model" placeholder="Vitz, Corolla…"></div>
        </div>
        <div class="row">
          <div class="field"><label for="vehicle_year" data-t="year"></label><input id="vehicle_year" type="number" inputmode="numeric" placeholder="2020"></div>
          <div class="field"><label for="vehicle_color" data-t="color"></label><input id="vehicle_color"></div>
        </div>
        <div class="field"><label for="vehicle_type" data-t="vtype"></label><select id="vehicle_type" data-opts="VEHICLE_TYPES" data-group="vtype"></select></div>
        <div class="field"><span class="label" data-t="fuel"></span><div class="chips" id="fuel_type" data-opts="FUEL_TYPES" data-group="fuel"></div></div>
        <div class="note green" id="green-note" hidden data-t="green_badge"></div>
        <div class="row">
          <div class="field"><span class="label" data-t="seats"></span><div class="chips" id="vehicle_seats" data-opts="SEATS"></div></div>
          <div class="field"><span class="label" data-t="ac"></span><div class="chips" id="vehicle_ac" data-opts="AC"></div></div>
        </div>
        <label data-t="plate"></label>
        <div class="row3">
          <div class="field"><select id="plate_region" data-opts="PLATE_REGIONS" data-group="region"></select></div>
          <div class="field"><input id="plate_code" inputmode="numeric" maxlength="2" data-ph="plate_code"></div>
          <div class="field"><input id="plate_number" autocapitalize="characters" maxlength="8" placeholder="A12345"></div>
        </div>
        <div class="note" id="old-car-note" hidden></div>
        <div id="owner-fields" hidden>
          <div class="sub" data-t="owner"></div>
          <div class="row">
            <div class="field"><label for="owner_name" data-t="em_name"></label><input id="owner_name"></div>
            <div class="field"><label for="owner_phone" data-t="em_phone"></label><input id="owner_phone" type="tel" inputmode="tel" placeholder="09XXXXXXXX"></div>
          </div>
          <div class="help" data-t="owner_help"></div>
        </div>
      </div>
      <div class="note" id="no-car-note" hidden data-t="no_car_note"></div>
    </section>

    <section data-t="s4" data-lead="s4_lead">
      <div class="field"><span class="label" data-t="services"></span><div class="chips" id="services" data-opts="SERVICES" data-group="services" data-multi></div><div class="help" data-t="services_help"></div></div>
      <div class="field"><span class="label" data-t="shift"></span><div class="chips" id="shift" data-opts="SHIFTS" data-group="shift"></div></div>
      <div class="field"><span class="label" data-t="phone_type"></span><div class="chips" id="phone_type" data-opts="PHONE_TYPES" data-group="phone"></div><div class="help" data-t="phone_help"></div></div>
      <div class="field"><label for="referral"><span data-t="referral"></span> <span class="opt" data-t="optional"></span></label><input id="referral" data-ph="referral_ph"></div>
    </section>

    <section data-t="s5" data-lead="s5_lead">
      <dl class="card" id="review"></dl>
      <details class="agreement" id="agreement"><summary><b data-t="agreement_title"></b><span id="ag-ver"></span></summary><pre id="ag-text"></pre></details>
      <label class="check" style="margin-bottom:10px"><input type="checkbox" id="agree"><span data-t="agree"></span></label>
      <label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
    </section>

    <div class="error" id="error"></div>
  </form>
</div>
<div class="fallback" id="fallback"><button type="button" class="sec" id="fb-back"></button><button type="button" id="fb-next"></button></div>

<script>
(function () {
  "use strict";
  var O = __OPTIONS__, BRAND = "__BRAND__";
  O.AC = ["yes", "no"];
  var tg = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var sections = $$("section");
  var step = 0, busy = false, lang = "am", state = { vehicle_mode: null }, AG = { version: 0, texts: {} };
  var useMain = !!(tg && tg.MainButton && tg.platform && tg.platform !== "unknown");
  var TODAY = new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10), YEAR = +TODAY.slice(0, 4);
  var phoneOk = function (v) { return /^(\+?251|0)?[79]\d{8}$/.test(String(v || "").replace(/[\s\-()]/g, "")); };

  // ---- ጽሑፎች ----
  function F(k, vars) {
    var s = (O.I18N[lang].f[k] != null ? O.I18N[lang].f[k] : O.I18N.am.f[k]) || k;
    vars = vars || {}; vars.brand = BRAND;
    return s.replace(/\{(\w+)\}/g, function (_, x) { return vars[x] != null ? vars[x] : ""; });
  }
  function L(group, v) {
    if (group === "ac") return F(v === "yes" ? "ac_yes" : "ac_no");
    var g = O.I18N[lang].opt[group], a = O.I18N.am.opt[group];
    return (g && g[v]) || (a && a[v]) || v;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    $$("[data-t]").forEach(function (el) { if (el.tagName !== "SECTION") el.textContent = F(el.dataset.t); });
    $$("[data-ph]").forEach(function (el) { el.placeholder = F(el.dataset.ph); });
    $$("select[data-opts]").forEach(function (sel) {
      [].forEach.call(sel.options, function (o, i) { o.textContent = i === 0 ? (sel.id === "plate_region" ? F("plate_region") : F("choose")) : L(sel.dataset.group, o.value); });
    });
    $$(".chips").forEach(function (box) { [].forEach.call(box.children, function (b) { b.textContent = box.id === "vehicle_ac" ? L("ac", b.dataset.v) : box.dataset.group ? L(box.dataset.group, b.dataset.v) : b.dataset.v; }); });
    $$("#vehicle_mode button").forEach(function (b) { b.firstChild.textContent = L("mode", b.dataset.v); b.lastChild.textContent = b.dataset.v === "none" && !O.TEST_FOR_NO_CAR ? "" : F("mode_hint_" + b.dataset.v); });
    $$("#langs button").forEach(function (b) { b.classList.toggle("sel", b.dataset.l === lang); });
    $("fb-back").textContent = F("back");
    $("ag-text").textContent = AG.texts[lang] || AG.texts.am || "";
    $("ag-ver").textContent = AG.version ? F("agreement_ver", { v: AG.version }) : "";
    if (!O.TEST_FOR_NO_CAR) { $("no-car-note").textContent = ""; }
    updateCarNotes();
    if (!$("form").hidden) render(true);
  }

  // ---- ምርጫዎች ----
  ["am", "en", "om", "ti"].forEach(function (l) {
    var b = document.createElement("button"); b.type = "button"; b.dataset.l = l; b.textContent = l === "am" ? "አማ" : l === "ti" ? "ትግ" : l.toUpperCase();
    b.addEventListener("click", function () { lang = l; applyLang(); });
    $("langs").appendChild(b);
  });
  sections.forEach(function () { $$(".steps")[0].appendChild(document.createElement("span")); });
  $$("select[data-opts]").forEach(function (sel) {
    sel.appendChild(document.createElement("option")).value = "";
    O[sel.dataset.opts].forEach(function (v) { var o = document.createElement("option"); o.value = v; sel.appendChild(o); });
  });
  $$(".chips").forEach(function (box) {
    var multi = box.hasAttribute("data-multi"), excl = box.dataset.exclusive;
    state[box.id] = multi ? [] : null;
    O[box.dataset.opts].forEach(function (v) {
      var b = document.createElement("button"); b.type = "button"; b.dataset.v = v;
      b.addEventListener("click", function () {
        if (multi) {
          var cur = state[box.id], i = cur.indexOf(v);
          if (i >= 0) cur.splice(i, 1);
          else { if (excl && v === excl) cur.length = 0; else if (excl) { var j = cur.indexOf(excl); if (j >= 0) cur.splice(j, 1); } cur.push(v); }
        } else state[box.id] = v;
        paint(box); box.classList.remove("invalid"); haptic("sel"); updateCarNotes();
      });
      box.appendChild(b);
    });
  });
  function paint(box) { var v = state[box.id]; [].forEach.call(box.children, function (b) { b.classList.toggle("sel", Array.isArray(v) ? v.indexOf(b.dataset.v) >= 0 : v === b.dataset.v); }); }
  O.VEHICLE_MODES.forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.dataset.v = k;
    b.appendChild(document.createTextNode("")); b.appendChild(document.createElement("small"));
    b.addEventListener("click", function () { setMode(k); haptic("sel"); });
    $("vehicle_mode").appendChild(b);
  });
  function setMode(k) {
    state.vehicle_mode = k;
    $$("#vehicle_mode button").forEach(function (b) { b.classList.toggle("sel", b.dataset.v === k); });
    $("vehicle_mode").classList.remove("invalid");
    $("vehicle-fields").hidden = k === "none"; $("owner-fields").hidden = k !== "other"; $("no-car-note").hidden = k !== "none";
    updateCarNotes();
  }
  function updateCarNotes() {
    $("green-note").hidden = O.GREEN_FUELS.indexOf(state.fuel_type) < 0;
    var y = parseInt($("vehicle_year").value, 10), old = y && YEAR - y > O.INSPECTION_AFTER_YEARS && YEAR - y <= O.MAX_VEHICLE_AGE;
    $("old-car-note").hidden = !old; $("old-car-note").textContent = F("old_car_note", { n: O.INSPECTION_AFTER_YEARS });
  }
  $("vehicle_year").addEventListener("input", updateCarNotes);
  $("telebirr_same").addEventListener("change", function () { $("telebirr_field").hidden = this.checked; });
  var maxDob = new Date(); maxDob.setFullYear(maxDob.getFullYear() - O.MIN_AGE);
  $("dob").max = maxDob.toISOString().slice(0, 10); $("dob").min = (YEAR - O.MAX_AGE - 1) + "-01-01";
  $("license_expiry").min = TODAY;
  $("vehicle_year").min = YEAR - O.MAX_VEHICLE_AGE; $("vehicle_year").max = YEAR + 1;

  function haptic(k) { try { if (k === "sel") tg.HapticFeedback.selectionChanged(); else tg.HapticFeedback.notificationOccurred(k); } catch (e) {} }
  function show(id) { ["screen-loading", "screen-message", "form"].forEach(function (s) { $(s).hidden = s !== id; }); }
  function message(icon, title, text) { $("msg-icon").textContent = icon; $("msg-title").textContent = title; $("msg-text").textContent = text; show("screen-message"); setButtons(null); }

  // ---- ማረጋገጫ ----
  function val(id) { return ($(id).value || "").trim(); }
  function age(dob) { var a = dob.split("-").map(Number), t = TODAY.split("-").map(Number); return t[0] - a[0] - ((t[1] < a[1] || (t[1] === a[1] && t[2] < a[2])) ? 1 : 0); }
  function validateStep() {
    var e = [];
    function req(id, msg, bad) { if (bad === undefined) bad = !val(id); $(id).classList.toggle("invalid", !!bad); if (bad) e.push(msg); }
    function chip(id, msg) { var v = state[id], empty = Array.isArray(v) ? !v.length : !v; $(id).classList.toggle("invalid", empty); if (empty) e.push(msg); }
    var last9 = function (v) { return v.replace(/\D/g, "").slice(-9); };
    if (step === 0) {
      req("full_name", F("e_name"), val("full_name").split(/\s+/).length < 2);
      req("phone", F("e_phone"), !phoneOk(val("phone")));
      if (!$("telebirr_same").checked) req("telebirr", F("e_telebirr"), !phoneOk(val("telebirr")));
      var a = val("dob") ? age(val("dob")) : -1;
      req("dob", F("e_age", { min: O.MIN_AGE, max: O.MAX_AGE }), a < O.MIN_AGE || a > O.MAX_AGE);
      req("sub_city", F("e_select"));
      req("tin_no", F("e_tin"), !/^\d{10}$/.test(val("tin_no")));
      chip("languages", F("e_spoken"));
      req("emergency_name", F("e_em"), val("emergency_name").length < 2);
      req("emergency_phone", F("e_em"), !phoneOk(val("emergency_phone")) || last9(val("emergency_phone")) === last9(val("phone")));
    } else if (step === 1) {
      req("license_no", F("e_license"), !/^[A-Za-z0-9\-\/]{4,30}$/.test(val("license_no")));
      req("license_grade", F("e_grade"), O.ACCEPTED_GRADES.indexOf(val("license_grade")) < 0);
      req("license_expiry", F("e_expiry"), !val("license_expiry") || val("license_expiry") < TODAY);
      chip("experience", F("e_select")); chip("prev_platforms", F("e_select"));
    } else if (step === 2) {
      if (!state.vehicle_mode) { $("vehicle_mode").classList.add("invalid"); e.push(F("e_mode")); }
      else if (state.vehicle_mode !== "none") {
        req("vehicle_make", F("e_select")); req("vehicle_model", F("e_text"), val("vehicle_model").length < 2);
        var y = parseInt(val("vehicle_year"), 10), minY = YEAR - O.MAX_VEHICLE_AGE;
        req("vehicle_year", F("e_year", { n: O.MAX_VEHICLE_AGE, y: minY }), !(y >= minY && y <= YEAR + 1));
        req("vehicle_color", F("e_text"), val("vehicle_color").length < 2);
        req("vehicle_type", F("e_select")); chip("fuel_type", F("e_select")); chip("vehicle_seats", F("e_select")); chip("vehicle_ac", F("e_select"));
        req("plate_region", F("e_select"));
        req("plate_code", F("e_plate"), !/^\d{1,2}$/.test(val("plate_code")));
        if (O.ALLOWED_PLATE_CODES && val("plate_code") && O.ALLOWED_PLATE_CODES.indexOf(val("plate_code")) < 0) req("plate_code", F("e_plate_code"), true);
        req("plate_number", F("e_plate"), !/^[A-Za-z]{0,2}\d{3,6}$/.test(val("plate_number").replace(/\s/g, "")));
        if (state.vehicle_mode === "other") { req("owner_name", F("e_owner"), val("owner_name").length < 2); req("owner_phone", F("e_owner"), !phoneOk(val("owner_phone"))); }
      }
    } else if (step === 3) {
      chip("services", F("e_services")); chip("shift", F("e_select")); chip("phone_type", F("e_select"));
    } else if (step === 4) {
      if (!$("agree").checked) { e.push(F("e_agree")); $("agreement").open = true; }
      else if (!$("consent").checked) e.push(F("e_consent"));
    }
    return e[0] || "";
  }

  var TEXT = ["full_name", "phone", "dob", "sub_city", "tin_no", "emergency_name", "emergency_phone", "license_no", "license_grade", "license_expiry", "referral"];
  var CAR = ["vehicle_make", "vehicle_model", "vehicle_year", "vehicle_color", "vehicle_type", "plate_region", "plate_code", "plate_number"];
  function profile() {
    var p = {};
    TEXT.forEach(function (f) { p[f] = val(f); });
    p.telebirr = $("telebirr_same").checked ? p.phone : val("telebirr");
    ["languages", "experience", "prev_platforms", "services", "shift", "phone_type"].forEach(function (f) { p[f] = state[f]; });
    p.vehicle_mode = state.vehicle_mode;
    if (state.vehicle_mode && state.vehicle_mode !== "none") {
      CAR.forEach(function (f) { p[f] = val(f); });
      p.fuel_type = state.fuel_type; p.vehicle_seats = state.vehicle_seats; p.vehicle_ac = state.vehicle_ac;
      if (state.vehicle_mode === "other") { p.owner_name = val("owner_name"); p.owner_phone = val("owner_phone"); }
    }
    return p;
  }
  function buildReview() {
    var p = profile(), j = function (g, a) { return (a || []).map(function (x) { return L(g, x); }).join(", "); };
    var rows = [
      [F("full_name"), p.full_name], [F("phone"), p.phone], [F("telebirr"), p.telebirr], [F("dob"), p.dob + " (" + age(p.dob) + " " + F("years") + ")"],
      [F("sub_city"), L("sub_city", p.sub_city)], [F("tin_no"), p.tin_no], [F("spoken"), j("spoken", p.languages)], [F("emergency"), p.emergency_name + " · " + p.emergency_phone],
      [F("license_no"), p.license_no.toUpperCase() + " · " + L("grade", p.license_grade)], [F("expiry"), p.license_expiry],
      [F("experience"), L("experience", p.experience)], [F("prev"), j("prev", p.prev_platforms)], [F("s3"), L("mode", p.vehicle_mode)]
    ];
    if (p.vehicle_mode !== "none") rows.push(
      [F("model"), L("make", p.vehicle_make) + " " + p.vehicle_model + " · " + p.vehicle_year], [F("vtype"), L("vtype", p.vehicle_type) + " · " + p.vehicle_color],
      [F("fuel"), L("fuel", p.fuel_type)], [F("seats") + " / AC", p.vehicle_seats + " · " + L("ac", p.vehicle_ac)],
      [F("plate"), L("region", p.plate_region) + " · " + p.plate_code + " · " + p.plate_number.toUpperCase()]
    );
    if (p.vehicle_mode === "other") rows.push([F("owner"), p.owner_name + " · " + p.owner_phone]);
    rows.push([F("services"), j("services", p.services)], [F("shift"), L("shift", p.shift)], [F("phone_type"), L("phone", p.phone_type)]);
    if (p.referral) rows.push([F("referral"), p.referral]);
    var dl = $("review"); dl.innerHTML = "";
    rows.forEach(function (r) { var d = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = r[0]; dd.textContent = r[1]; d.appendChild(dt); d.appendChild(dd); dl.appendChild(d); });
  }

  // ---- ደረጃዎች ----
  function render(keepError) {
    sections.forEach(function (s, i) { s.classList.toggle("active", i === step); });
    $$(".steps span").forEach(function (s, i) { s.classList.toggle("on", i <= step); });
    $("kicker").textContent = F("step", { i: step + 1, n: sections.length });
    $("title").textContent = F(sections[step].dataset.t); $("lead").textContent = F(sections[step].dataset.lead);
    if (!keepError) $("error").textContent = "";
    if (step === sections.length - 1) buildReview();
    setButtons(step === sections.length - 1 ? F("send") : F("next"));
    if (!keepError) window.scrollTo(0, 0);
  }
  function setButtons(text) {
    if (useMain) {
      if (text) { tg.MainButton.setText(text); tg.MainButton.show(); } else tg.MainButton.hide();
      if (text && step > 0) tg.BackButton.show(); else tg.BackButton.hide();
    } else { $("fallback").style.display = text ? "flex" : "none"; $("fb-next").textContent = text || ""; $("fb-back").style.display = step > 0 ? "" : "none"; }
  }
  function next() {
    if (busy) return;
    var err = validateStep();
    if (err) { $("error").textContent = err; haptic("error"); var f = document.querySelector("section.active .invalid"); if (f && f.scrollIntoView) f.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    if (step < sections.length - 1) { step++; render(); return; }
    submit();
  }
  function back() { if (step > 0 && !busy) { step--; render(); } }

  function api(path, body) {
    body.initData = tg ? tg.initData : "";
    return fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function submit() {
    busy = true;
    if (useMain) tg.MainButton.showProgress(false); else $("fb-next").disabled = true;
    api("/api/register", { profile: profile(), lang: lang, agree: AG.version }).then(function (res) {
      if (!res.ok) throw new Error(res.error || F("e_network"));
      haptic("success");
      try { tg.disableClosingConfirmation(); } catch (e) {}
      if (res.suspended) message("✅", F("ok_title"), F("locked_text")); else message("✅", F("ok_title"), F("ok_text"));
      setTimeout(function () { if (tg) tg.close(); }, 2500);
    }).catch(function (e) { $("error").textContent = e.message || F("e_network"); haptic("error"); })
      .then(function () { busy = false; if (useMain) tg.MainButton.hideProgress(); else $("fb-next").disabled = false; });
  }

  function prefill(d, user, ref) {
    if (ref) $("referral").value = ref;
    if (!d) { if (user) $("full_name").value = [user.first_name, user.last_name].filter(Boolean).join(" "); return; }
    TEXT.concat(CAR, ["owner_name", "owner_phone", "telebirr"]).forEach(function (k) { if (d[k] != null && $(k)) $(k).value = String(d[k]).replace(/^\+251/, "0"); });
    $("telebirr_same").checked = !d.telebirr || d.telebirr === d.phone; $("telebirr_field").hidden = $("telebirr_same").checked;
    ["languages", "prev_platforms", "services"].forEach(function (k) { if (d[k]) state[k] = d[k].slice(); });
    ["experience", "shift", "phone_type", "vehicle_seats", "fuel_type"].forEach(function (k) { if (d[k]) state[k] = d[k]; });
    if (d.vehicle_ac != null) state.vehicle_ac = d.vehicle_ac ? "yes" : "no";
    $$(".chips").forEach(paint);
    if (d.vehicle_mode) setMode(d.vehicle_mode);
  }

  // ---- ጅምር ----
  if (useMain) { tg.MainButton.onClick(next); tg.BackButton.onClick(back); }
  $("fb-next").addEventListener("click", next); $("fb-back").addEventListener("click", back);
  $("form").addEventListener("submit", function (e) { e.preventDefault(); next(); });
  var tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
  if (tgLang && O.I18N[tgLang.slice(0, 2)]) lang = tgLang.slice(0, 2);
  applyLang();

  if (!tg || !tg.initData) { message("📱", F("open_tg_title"), F("open_tg_text")); return; }
  tg.ready(); tg.expand();
  try { tg.enableClosingConfirmation(); } catch (e) {}

  api("/api/me", {}).then(function (res) {
    if (res._status === 401) return message("🔒", F("open_tg_title"), res.error || "");
    if (res.lang && O.I18N[res.lang]) { lang = res.lang; applyLang(); }
    var d = res.driver;
    if (d && d.status === "pending") return message("⏳", F("locked_pending"), F("locked_text"));
    if (d && ["test", "inspection", "orientation"].indexOf(d.status) >= 0) return message("📅", F("locked_stage"), F("locked_text"));
    if (d && d.status === "active") return message("🎉", F("locked_active"), F("locked_text"));
    if (res.agreement) { AG = res.agreement; applyLang(); }
    if (d && d.status === "suspended" && d.fix_state === "submitted") return message("⛔", F("locked_suspended"), F("locked_text"));
    if (d && d.status === "suspended") $("susp-banner").hidden = false;
    prefill(d, res.user, res.ref_code);
    show("form"); render();
    if (d && d.status === "rejected" && d.reject_reason) {
      var r = (O.I18N[lang].reasons || {})[d.reject_reason] || O.I18N.am.reasons[d.reject_reason] || d.reject_reason;
      $("error").textContent = F("prev_reject") + r.replace("{brand}", BRAND);
    }
  }).catch(function () { message("📡", F("e_network"), ""); });
})();
</script>
